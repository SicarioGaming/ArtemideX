name: Build and test

# Every push to a branch and every pull request: the JVM tests, lint, the native host tests, the
# tool checks, and the debug and test APKs. Pull requests and manual runs also run the on-device
# tests on three emulators (a phone, a foldable and a tablet), but pushes don't, to save Actions
# minutes. Actions are pinned to full commit hashes; the comment says which release each one is.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Gradle won't even configure the project without the NDK version build.gradle names
      - name: Install the NDK
        run: |
          NDK=$(grep -oP 'ndkVersion "\K[^"]+' app/build.gradle)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      # Lint fails on anything not already listed in app/lint-baseline.xml
      - name: JVM tests and lint
        run: ./gradlew --no-daemon --continue testNonRootDebugUnitTest lintNonRootDebug

      # Each exits 1 if a check fails. (pyrowave_partial_test needs a GPU, so it isn't here.)
      - name: Native host tests
        if: ${{ !cancelled() }}
        run: |
          sh app/src/main/jni/moonlight-core/tests/partial_frame_test.sh
          cd app/src/main/jni/vulkan/tests
          for t in frame_pacer present_scheduler; do
            g++ -std=c++17 -O2 -I.. ../$t.cpp ${t}_test.cpp -o "$RUNNER_TEMP/${t}_test"
            "$RUNNER_TEMP/${t}_test"
          done

      - name: Tool checks
        if: ${{ !cancelled() }}
        run: bash .github/tools/check-tools.sh

      - name: Build the debug APK and the test APK
        run: ./gradlew --no-daemon assembleNonRootDebug assembleNonRootDebugAndroidTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starwire-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starwire-debug-tests
          path: app/build/outputs/apk/androidTest/nonRoot/debug/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-nonRootDebug.*
          if-no-files-found: ignore

  emulator:
    name: Device tests (${{ matrix.name }})
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 360 dp wide: the narrow case, like a Galaxy Z Fold's cover screen
          - { name: phone, profile: small_phone }
          # A nearly square inner screen and a hinge sensor, so the foldable code runs
          - { name: foldable, profile: pixel_fold }
          - { name: tablet, profile: pixel_tablet }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starwire-debug
          path: apks/app

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starwire-debug-tests
          path: apks/tests

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An x86_64 emulator has no arm64-only libraries (PyroWave, custom Vulkan drivers), no
      # hardware decoders and no microphone, so tests that need those can fail here
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: bash .github/tools/emulator-tests.sh emulator-5554 apks/app/app-nonRoot-debug.apk apks/tests/app-nonRoot-debug-androidTest.apk device-tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: device-tests-${{ matrix.name }}
          path: device-tests/
          if-no-files-found: ignore
