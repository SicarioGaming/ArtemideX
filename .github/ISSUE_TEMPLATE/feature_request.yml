name: Feature idea
description: Something you'd like Voidlink to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Does another Moonlight app already have it?
      description: If so, which one (a link helps). Voidlink can often bring it over.
